name: Atualizar dados via MT5

# Só roda quando disparado manualmente — pelo botão "Run workflow" no
# GitHub, ou pela API (é assim que o app no Streamlit Cloud aciona,
# quando você clica em "Atualizar via MT5" na interface).
on:
  workflow_dispatch:

jobs:
  update:
    # roda no runner instalado no SEU PC de casa — não em servidor do
    # GitHub. É só aí que o MetaTrader 5 está aberto e acessível.
    runs-on: self-hosted

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-local.txt

      - name: Buscar candles reais via MT5
        run: python mt5_bridge/update_data.py

      - name: Commit e push do snapshot atualizado
        run: |
          git config user.name "MT5 Bridge (automático)"
          git config user.email "mt5-bridge@local"
          git add data/mt5_snapshot.json
          git diff --staged --quiet && echo "Nada novo pra commitar." || (
            git commit -m "Atualização de dados via MT5 - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          )
