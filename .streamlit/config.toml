# Configuração do Streamlit para este projeto.
#
# O prompt de e-mail ("Welcome to Streamlit! ... Email:") aparece na
# primeira execução e FICA ESPERANDO input no terminal — se a janela
# não estiver em foco, parece que o app travou. Desligar a coleta de
# estatísticas elimina esse prompt.

[browser]
gatherUsageStats = false

[server]
port = 8501
headless = false
# Sem isso, uma edição em qualquer arquivo .py reinicia o app no meio
# de uma análise.
fileWatcherType = "none"

[theme]
base = "dark"
backgroundColor = "#0A0E13"
secondaryBackgroundColor = "#121A23"
textColor = "#E4EDF5"
primaryColor = "#F5B841"
font = "sans serif"
